# mcp-lab (ADR 0009). Instalado pelo sync-edge.sh só depois que o certificado existe em
# /etc/letsencrypt/live/mcp-lab/ (um certificado para os dois nomes).

# Primeira barreira contra abuso; o host ainda aplica rate limit por usuário (ADR 0008).
limit_req_zone $binary_remote_addr zone=mcplab_ip:10m rate=10r/s;

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mcp.agateo.com.br;

  ssl_certificate     /etc/letsencrypt/live/mcp-lab/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mcp-lab/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL_mcplab:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 1m;

  location / {
    limit_req zone=mcplab_ip burst=40 nodelay;
    limit_req_status 429;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcplab_api http://mcp-lab-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Streamable HTTP usa SSE: sem buffer e com timeout longo para streams abertos.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    proxy_pass $mcplab_api;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name auth.agateo.com.br;

  ssl_certificate     /etc/letsencrypt/live/mcp-lab/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mcp-lab/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL_mcplab:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    limit_req zone=mcplab_ip burst=40 nodelay;
    limit_req_status 429;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcplab_auth http://mcp-lab-auth:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_pass $mcplab_auth;
  }
}
