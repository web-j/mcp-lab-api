server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' __SUPABASE_URL__; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Rotas da página única: /, /oauth/consent, /auth/confirmed, /auth/reset.
  location / {
    try_files $uri /index.html;
  }
}
